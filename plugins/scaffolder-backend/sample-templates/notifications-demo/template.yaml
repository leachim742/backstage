apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: notifications-demo
  title: Test Notifications template
  description: scaffolder v1beta3 template demo sending notification
spec:
  owner: backstage/techdocs-core
  type: service
  parameters:
    - title: Fill in some steps
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
  steps:
    - action: debug:log
      id: debug-log
      name: Log Hello World
      input:
        message: 'Hello, World!'
      
    - id: wait-approval
      name: Wait for Production Deployment Approval
      action: gated:waitForApproval
      input:
        reason: 'Approval required for production deployment'
        approvers:
          - user:development/guest

          
    - action: debug:log
      id: debug-log2
      name: Log Hello Worldd
      input:
        message: 'Hello, World!!!!'